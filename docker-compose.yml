# Infraestructura como Código — TP3 GlobalLogistics S.A.
# Levanta exactamente 1 balanceador de carga (NGINX) y 3 réplicas del microservicio.
#   docker compose up -d --build

name: tp3-globallogistics

services:
  api:
    build: ./api
    image: globallogistics/shipment-api:1.0
    # Sin container_name ni puertos publicados: así Docker puede crear varias réplicas
    expose:
      - "3000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"      # cada réplica usa como máximo medio núcleo
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  load-balancer:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"          # http://localhost:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy   # arranca recién cuando las réplicas están sanas
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
