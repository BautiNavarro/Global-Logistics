# Balanceador de carga (proxy inverso) — TP3 GlobalLogistics S.A.
worker_processes auto;

events {
    # Conexiones simultáneas por proceso worker. Si este número se queda corto,
    # NGINX empieza a rechazar conexiones bajo concurrencia extrema.
    worker_connections 4096;
}

http {
    # Log que muestra qué réplica atendió cada petición y cuánto tardó
    log_format balanceo '$remote_addr "$request" $status '
                        'replica=$upstream_addr t_total=$request_time t_replica=$upstream_response_time';
    access_log /var/log/nginx/access.log balanceo buffer=32k flush=5s;

    # DNS interno de Docker: permite resolver el nombre del servicio "api"
    # a las IPs de sus 3 réplicas (y re-resolver si un contenedor se reinicia).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;          # memoria compartida, necesaria para "resolve"
        # Algoritmo por defecto: Round Robin (reparte en turnos iguales).

        # Se apunta al NOMBRE DEL SERVICIO de Compose, nunca a localhost.
        # Health check pasivo: si una réplica falla 2 veces en 10 s,
        # NGINX la saca de la rotación durante 10 s y reparte entre las demás.
        server api:3000 resolve max_fails=2 fail_timeout=10s;

        keepalive 64;                  # reutiliza conexiones con las réplicas
    }

    server {
        listen 80;

        # Health check del propio balanceador (lo usa Docker)
        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","componente":"load-balancer"}';
        }

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Resiliencia: si una réplica no responde, se reintenta en otra
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;

            # Para la evidencia: muestra en la respuesta qué réplica atendió
            add_header X-Upstream-Replica $upstream_addr always;
        }
    }
}
